[package]
name = "reminderr-desktop"
version = "0.1.0"
description = "Reminderr Mini App — Tauri wrapper"
edition = "2021"
authors = ["@e_rnst"]

[lib]
name = "reminderr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Phase 13.0: компактный релиз — десктоп-обёртка должна быть лёгкой.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
