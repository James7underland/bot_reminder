[project]
name = "bot-reminder"
version = "0.1.0"
description = "Telegram reminder bot (Microsoft To Do-like)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["config", "database", "bot", "scheduler", "tzutil"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
