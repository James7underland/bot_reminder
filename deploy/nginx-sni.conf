# SNI-роутер на :443 (без расшифровки — ssl_preread смотрит только SNI).
# Делит 443 между Mini App и VPN, НЕ трогая конфиг xray.
#
# Подключение: в /etc/nginx/nginx.conf (ГЛАВНЫЙ контекст, вне http{}):
#   include /etc/nginx/stream-sni.conf;
# затем:  nginx -t && systemctl reload nginx
#
# Требует, чтобы host:443 был свободен (xray перепубликован на
# 127.0.0.1:8444 — см. DEPLOYMENT.md §6) и Caddy слушал 127.0.0.1:8443.

stream {
    map $ssl_preread_server_name $sni_upstream {
        reminderr.ru  127.0.0.1:8443;   # Mini App → Caddy
        default              127.0.0.1:8444;   # всё прочее → VPN (xray)
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $sni_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 600s;
    }
}
