<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Напоминалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#fff);
    --text:var(--tg-theme-text-color,#000);
    --hint:var(--tg-theme-hint-color,#888);
    --link:var(--tg-theme-link-color,#2481cc);
    --btn:var(--tg-theme-button-color,#2481cc);
    --btn-text:var(--tg-theme-button-text-color,#fff);
    --sec:var(--tg-theme-secondary-bg-color,#f1f1f1);
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 -apple-system,system-ui,sans-serif;
       background:var(--bg);color:var(--text)}
  /* Phase 11.13: убираем фиксированный max-width — на десктопе body
     должно занимать ВСЁ доступное пространство (особенно в fullscreen,
     иначе виден столбик 760px по центру и пустые поля). Содержимое
     центрируем через flex/grid, если потребуется на очень широких
     экранах. */
  /* Phase 11.14: icon-buttons в шапке (≡ ⋯ ⛶) и drawer-навигация. */
  .icon-btn{background:transparent;border:none;color:var(--link);
    font-size:20px;line-height:1;padding:6px 10px;cursor:pointer;
    border-radius:8px;transition:background .15s}
  .icon-btn:hover{background:rgba(127,127,127,.12)}
  body.is-mobile .fs-btn{display:none}
  /* Phase 11.15: CSS-pseudo-fullscreen — последний резерв, когда ни
     tg.requestFullscreen, ни document.requestFullscreen не работают
     (часто из-за iframe permissions policy в Telegram WebApp). */
  body.pseudo-fs{position:fixed;inset:0;width:100vw;height:100vh;
    z-index:9999;overflow-y:auto;background:var(--bg)}
  /* Phase 11.16: empty-states для пустых видов. Большая иконка,
     заголовок, подсказка — приятнее, чем «Пока нет задач» серым. */
  .empty-state{display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:40px 24px;
    color:var(--hint);gap:10px;min-height:50vh}
  .empty-state .empty-icon{font-size:64px;line-height:1;
    filter:grayscale(.3);opacity:.85}
  .empty-state .empty-title{font-size:18px;font-weight:600;
    color:var(--text)}
  .empty-state .empty-hint{font-size:14px;line-height:1.45;
    max-width:340px;color:var(--hint)}
  /* Phase 11.16: анимация при выполнении задачи — короткий fade-out,
     перед тем как load() её уберёт из активного списка. */
  @keyframes task-complete{
    0%{opacity:1;transform:translateX(0)}
    60%{opacity:.5;transform:translateX(8px)}
    100%{opacity:0;transform:translateX(40px)}
  }
  li.completing{animation:task-complete .35s ease-in forwards;
    pointer-events:none}

  /* Сайдбар-drawer */
  .drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,80vw);
    background:var(--bg);color:var(--text);
    border-right:1px solid rgba(127,127,127,.18);
    transform:translateX(-100%);transition:transform .22s ease-out;
    z-index:200;overflow-y:auto;padding:8px 0;
    box-shadow:4px 0 16px rgba(0,0,0,.18)}
  .drawer.open{transform:translateX(0)}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);
    z-index:190;opacity:0;transition:opacity .2s;pointer-events:none}
  .drawer-backdrop.open{opacity:1;pointer-events:auto}
  .drawer-header{display:flex;align-items:center;justify-content:space-between;
    padding:6px 12px 10px;border-bottom:1px solid rgba(127,127,127,.15)}
  .drawer-title{font-weight:600;font-size:16px}
  .drawer-section{padding:6px 0;border-bottom:1px solid rgba(127,127,127,.12)}
  .drawer-section:last-child{border-bottom:none}
  .drawer-label{font-size:11px;color:var(--hint);text-transform:uppercase;
    letter-spacing:.5px;padding:6px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:8px}
  .drawer-item{display:flex;align-items:center;gap:10px;
    background:transparent;border:none;color:var(--text);
    padding:10px 16px;width:100%;text-align:left;cursor:pointer;
    font-size:14px;border-radius:0;transition:background .12s}
  .drawer-item:hover{background:rgba(127,127,127,.12)}
  .drawer-item.active{background:rgba(56,134,206,.18);color:var(--btn);
    font-weight:600}
  .drawer-item .list-dot{display:inline-block;width:10px;height:10px;
    border-radius:50%;flex:none}
  .drawer-item .list-actions{margin-left:auto;display:none;gap:4px}
  .drawer-item:hover .list-actions{display:inline-flex}
  .drawer-item .list-actions button{background:none;border:none;
    color:var(--hint);font-size:14px;cursor:pointer;padding:2px 4px}
  .drawer-item .list-actions button:hover{color:var(--text)}

  /* Overflow-меню ⋯ */
  .popmenu{position:fixed;top:54px;right:8px;background:var(--bg);
    border:1px solid rgba(127,127,127,.2);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px 0;z-index:150;
    min-width:200px}
  .popmenu-item{display:block;width:100%;text-align:left;
    background:transparent;border:none;padding:10px 14px;color:var(--text);
    cursor:pointer;font-size:14px}
  .popmenu-item:hover{background:rgba(127,127,127,.12)}

  /* Compact inline-bar для поиска/сортировки/showDone */
  .bar-inline{align-items:center}
  .compact-sel{flex:none;width:auto;min-width:60px;padding:9px 8px}
  .inline-toggle{flex:none;display:inline-flex;align-items:center;gap:4px;
    color:var(--hint);font-size:13px;cursor:pointer;padding:6px 8px;
    border-radius:8px;transition:background .15s}
  .inline-toggle:hover{background:rgba(127,127,127,.1)}
  .inline-toggle input{margin-right:2px}
  header{padding:10px 8px 6px;font-size:20px;font-weight:700;
    display:flex;align-items:center;gap:4px;
    border-bottom:1px solid rgba(127,127,127,.12)}
  header h1{flex:1;margin:0;font-size:inherit;font-weight:inherit;
    padding-left:4px}
  .stats-badge{font-size:13px;font-weight:500;color:var(--hint);
    background:var(--card);padding:6px 12px;border-radius:14px;
    cursor:pointer;user-select:none;white-space:nowrap;
    border:1px solid transparent;transition:border-color .15s}
  .stats-badge:hover{border-color:var(--hint)}
  .stats-badge .num{color:var(--text);font-weight:600}
  .stats-badge .imp{color:#f5b301}
  .bar{display:flex;gap:8px;padding:8px 16px}
  .bar input,.bar select{flex:1;min-width:0;padding:9px 10px;border-radius:10px;
       border:1px solid var(--sec);background:var(--sec);color:var(--text)}
  button{cursor:pointer;border:0;border-radius:10px;
       background:var(--btn);color:var(--btn-text);padding:9px 14px;font-size:15px}
  .ghost{background:transparent;color:var(--link);padding:6px}
  ul{list-style:none;margin:0;padding:0 8px 24px}
  /* Phase 11.12: карточка задачи. Чуть больше воздуха, мягкая тень,
     левая цветная полоска (color из списка) — как в Microsoft To Do. */
  li{background:var(--sec);margin:6px 4px;border-radius:10px;
    padding:12px 14px;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
    transition:box-shadow .15s, transform .12s}
  li:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
  li.done{opacity:.7}
  li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--accent, transparent)}
  .row{display:flex;align-items:center;gap:12px}
  /* Phase 11.12: круглый чек-бокс с явной иконкой ✓ при выполнении. */
  .chk{width:26px;height:26px;flex:none;border:2px solid var(--hint);
       border-radius:50%;margin-top:0;cursor:pointer;
       display:flex;align-items:center;justify-content:center;
       transition:background .15s, border-color .15s, transform .1s;
       color:transparent;font-size:14px;line-height:1}
  .chk:hover{transform:scale(1.08);border-color:var(--btn)}
  .chk.done{background:var(--btn);border-color:var(--btn);
    color:var(--btn-text)}
  .chk.done::after{content:"✓"}
  .ttl{flex:1;min-width:0;word-break:break-word;font-size:15px;
    line-height:1.35}
  .done .ttl{text-decoration:line-through;color:var(--hint)}
  .meta{font-size:12px;color:var(--hint);margin-top:4px}
  .overdue .meta,.overdue .ttl{color:#e53935}
  .star{font-size:22px;color:var(--hint);flex:none;background:none;
    padding:0 4px;line-height:1;transition:transform .1s}
  .star:hover{transform:scale(1.15)}
  .star.on{color:#f5b301}
  .mv{flex:none;background:none;color:var(--hint);font-size:12px;
      padding:2px 4px;line-height:1}
  .drag-handle{flex:none;color:var(--hint);font-size:18px;cursor:grab;
      padding:0 6px;line-height:1;user-select:none;touch-action:none;
      opacity:.5;transition:opacity .1s}
  li:hover .drag-handle{opacity:.9}
  .drag-handle:active{cursor:grabbing}
  li.dragging{opacity:.55}
  li.drop-above{box-shadow:inset 0 3px 0 var(--btn)}
  li.drop-below{box-shadow:inset 0 -3px 0 var(--btn)}
  /* Phase 11.7: inline-edit заголовка задачи */
  .edit-title{width:100%;padding:4px 6px;font-size:15px;
    background:var(--card);color:var(--text);
    border:1px solid var(--btn);border-radius:6px}
  li.editing .panel{display:none !important}
  .panel{margin-top:10px;display:none;flex-direction:column;gap:8px}
  .panel.open{display:flex}
  .panel label{font-size:12px;color:var(--hint)}
  .panel input,.panel select,.panel textarea{width:100%;padding:8px;
       border-radius:8px;border:1px solid var(--hint);
       background:var(--bg);color:var(--text);font:inherit}
  .panel textarea{min-height:54px;resize:vertical}
  .steps .step{display:flex;align-items:center;gap:8px;margin:5px 0}
  .schk{width:18px;height:18px;flex:none;border:2px solid var(--hint);
       border-radius:4px}
  .schk.done{background:var(--btn);border-color:var(--btn)}
  .sdone{text-decoration:line-through;color:var(--hint)}
  .sdel{margin-left:auto;color:var(--hint)}
  .addstep{display:flex;gap:8px}
  .f-cust{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .f-cust .ckrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .f-cust .f-rcn{width:60px;padding:4px}
  .f-cust .f-rcu{width:auto;padding:4px}
  .f-cust .wd{display:flex;flex-wrap:wrap;gap:6px}
  .f-cust .wd label{font-size:12px}
  .pbtns{display:flex;gap:8px;flex-wrap:wrap}
  .pbtns button.danger{color:#dc2626}
  .pbtns button.danger:hover{background:rgba(220,38,38,.1)}
  .muted{color:var(--hint);text-align:center;padding:30px 16px}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;z-index:9999;
    padding:20px}
  .modal{background:var(--bg);color:var(--fg);
    border:1px solid var(--hint);border-radius:12px;
    padding:16px;max-width:360px;width:100%}
  .modal-title{font-size:15px;margin-bottom:10px}
  .modal-input{width:100%;padding:10px;font-size:15px;
    background:var(--card);color:var(--fg);
    border:1px solid var(--hint);border-radius:8px}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;
    margin-top:12px}
  .modal-btns button{padding:8px 14px}
  .modal-list{max-width:420px}
  .modal-search-wrap{margin-bottom:8px}
  .modal-items{max-height:60vh;overflow-y:auto;
    border:1px solid var(--hint);border-radius:8px;padding:4px 0}
  .modal-group{font-size:12px;color:var(--hint);
    padding:8px 12px 4px;font-weight:600;letter-spacing:.5px;
    text-transform:uppercase}
  .modal-item{padding:10px 12px;cursor:pointer;font-size:14px;
    border-radius:6px;margin:0 4px}
  .modal-item:hover{background:var(--card)}
  .modal-item.sel{background:var(--btn);color:#fff}
  .modal-item.sel:hover{background:var(--btn)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%)
    translateY(20px);background:#222;color:#fff;padding:10px 14px;
    border-radius:10px;font-size:14px;max-width:90vw;
    box-shadow:0 4px 16px rgba(0,0,0,.35);opacity:0;
    transition:opacity .2s, transform .2s;z-index:10000;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#b91c1c}
  .toast.ok{background:#16a34a}
  .toast.undo{display:flex;gap:12px;align-items:center;
    background:#1f2937;pointer-events:auto}
  .toast-action{background:transparent;color:#60a5fa;border:none;
    font-weight:600;padding:0;cursor:pointer}
  .toast-action:hover{text-decoration:underline}
  /* Phase 11.4: bulk-actions bar + selection visuals */
  .bulk-bar{display:flex;gap:8px;align-items:center;
    padding:8px 16px;background:var(--card);
    border-bottom:1px solid var(--hint);position:sticky;top:0;z-index:50}
  .bulk-bar #bulkCount{flex:1;font-size:14px;color:var(--text)}
  .bulk-bar button{padding:6px 10px;font-size:16px}
  body.select-mode .drag-handle,
  body.select-mode .mv,
  body.select-mode .star{display:none}
  body.select-mode .chk{pointer-events:none;opacity:.5}
  li.li-sel{outline:2px solid var(--btn);outline-offset:-2px}
  li.li-sel::after{content:"✓";position:absolute;top:50%;right:12px;
    transform:translateY(-50%);color:var(--btn);font-weight:700;
    font-size:18px;pointer-events:none}
  #list li{position:relative}
  /* Phase 11.2: section tabs + notes grid */
  .bar.tabs{padding-top:0;padding-bottom:0;gap:0;border-bottom:1px solid var(--card)}
  .tab{flex:1;background:none;color:var(--hint);font-weight:600;
    padding:10px 0;border:none;border-bottom:2px solid transparent;
    border-radius:0;cursor:pointer;font-size:15px}
  .tab.active{color:var(--text);border-bottom-color:var(--btn)}
  .notes-grid{list-style:none;padding:0 12px;margin:0;display:grid;
    grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:380px){ .notes-grid{grid-template-columns:1fr} }
  .note{background:var(--card);border-radius:12px;padding:12px;
    cursor:pointer;position:relative;display:flex;flex-direction:column;
    gap:6px;min-height:90px;border:1px solid transparent;
    box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .12s,
      box-shadow .12s}
  .note:hover{transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(0,0,0,.12)}
  .note.pinned{border-color:#f5b301}
  /* Phase 11.12: пастельный фон карточки заметки → внутри ВСЕГДА
     тёмный текст, иначе в dark-теме var(--text) даёт белое-на-светлом. */
  .note,
  .note .ntitle,
  .note .nbody,
  .note .nmeta{color:#1f2937 !important}
  .note .ntitle{font-weight:600;font-size:14px;word-break:break-word;
    line-height:1.25}
  .note .nbody{font-size:13px;line-height:1.4;
    word-break:break-word;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:6;
    -webkit-box-orient:vertical}
  /* Phase 11.5/11.12: markdown — все цвета явные, под пастель. */
  .md a{color:#1d4ed8 !important;text-decoration:underline;
    word-break:break-all}
  .md code{background:rgba(0,0,0,.08);color:#111 !important;
    padding:0 4px;border-radius:4px;
    font-family:ui-monospace,Menlo,monospace;font-size:.92em}
  .md b{font-weight:700}
  .md i{font-style:italic}
  .md .md-cb{display:inline-block;width:1em;color:#1f2937 !important;
    cursor:pointer;user-select:none;font-size:1.05em}
  .md .md-cb:hover{transform:scale(1.15)}
  .md .md-cb-on{color:#16a34a !important}
  .md .md-done{text-decoration:line-through;opacity:.55}
  .note .nmeta{font-size:11px;margin-top:auto;color:#475569 !important}
  .note .npin{position:absolute;top:8px;right:8px;font-size:14px;
    color:#f5b301;opacity:.9}
  /* Notes editor modal */
  .note-editor input.modal-title-input,
  .note-editor textarea.modal-body-input{width:100%;
    padding:8px;background:var(--card);color:var(--text);
    border:1px solid var(--hint);border-radius:8px;font-size:14px;
    font-family:inherit}
  .note-editor textarea.modal-body-input{min-height:160px;resize:vertical}
  .note-editor .row{display:flex;gap:8px;align-items:center;
    margin-top:8px;flex-wrap:wrap}
  .note-editor .color-swatch{width:24px;height:24px;border-radius:50%;
    cursor:pointer;border:2px solid transparent}
  .note-editor .color-swatch.sel{border-color:var(--text)}
</style>
</head>
<body>
<header>
  <button id="navBtn" class="icon-btn" title="Меню">≡</button>
  <h1 id="appTitle">Мои задачи</h1>
  <div id="statsBadge" class="stats-badge" hidden title="Статистика">…</div>
  <button id="fsBtn" class="icon-btn" hidden title="На весь экран">⛶</button>
  <button id="moreBtn" class="icon-btn" title="Ещё">⋯</button>
</header>

<!-- Phase 11.14: боковая панель навигации (drawer). По клику ≡
     открывается слева; видны разделы, виды, списки. -->
<aside id="navDrawer" class="drawer" hidden>
  <div class="drawer-header">
    <span class="drawer-title">Навигация</span>
    <button id="drawerClose" class="icon-btn" title="Закрыть">✕</button>
  </div>
  <div class="drawer-section">
    <div class="drawer-label">Разделы</div>
    <button class="drawer-item" data-go="tasks">📋 Задачи</button>
    <button class="drawer-item" data-go="notes">📓 Заметки</button>
  </div>
  <div class="drawer-section nav-views">
    <div class="drawer-label">Виды задач</div>
    <button class="drawer-item drawer-view" data-view="all">🏠 Все задачи</button>
    <button class="drawer-item drawer-view" data-view="myday">🗓 Мой день</button>
    <button class="drawer-item drawer-view" data-view="planned">📅 Планируется</button>
    <button class="drawer-item drawer-view" data-view="important">⭐ Важно</button>
    <button class="drawer-item drawer-view" data-view="archive">🗂 Архив</button>
  </div>
  <div class="drawer-section nav-lists">
    <div class="drawer-label">
      Списки
      <button id="drawerNewList" class="icon-btn" title="Создать список">+</button>
    </div>
    <div id="drawerListItems"></div>
  </div>
</aside>
<div id="navBackdrop" class="drawer-backdrop" hidden></div>

<!-- Overflow-меню ⋯ — редкие действия (часовой пояс, экспорт, импорт). -->
<div id="moreMenu" class="popmenu" hidden>
  <button class="popmenu-item" data-action="tz">⚙ Часовой пояс</button>
  <button class="popmenu-item" data-action="export">📦 Экспорт JSON</button>
  <button class="popmenu-item" data-action="import">↩ Импорт JSON</button>
</div>
<input id="impFile" type="file" accept="application/json" hidden>

<!-- Раздел задач -->
<section id="tasksSection">
  <div class="bar">
    <input id="newTask" placeholder="+ Новая задача…" autocomplete="off">
    <button id="addBtn">Добавить</button>
  </div>
  <div class="bar bar-inline">
    <input id="search" placeholder="🔎 Поиск…" autocomplete="off">
    <select id="sortSel" class="compact-sel">
      <option value="">↕</option>
      <option value="important">★</option>
      <option value="due">📅</option>
      <option value="alpha">A→Z</option>
      <option value="created">⏱</option>
    </select>
    <label class="inline-toggle" title="Показывать выполненные">
      <input type="checkbox" id="showDone"> ✓
    </label>
  </div>
  <!-- Скрытые «совместимые» элементы — drawer и overflow-меню работают
       поверх существующих обработчиков listSel/viewSel/newList/.../tzBtn.
       Минимум переделок логики, максимум UI-полировки. -->
  <select id="listSel" hidden></select>
  <select id="viewSel" hidden>
    <option value="all">Все задачи</option>
    <option value="myday">🗓 Мой день</option>
    <option value="planned">📅 Планируется</option>
    <option value="important">⭐ Важно</option>
    <option value="archive">🗂 Архив</option>
  </select>
  <button id="newList" hidden></button>
  <button id="renList" hidden></button>
  <button id="clrList" hidden></button>
  <button id="delList" hidden></button>
  <button id="tzBtn" hidden></button>
  <button id="expBtn" hidden></button>
  <button id="impBtn" hidden></button>
  <!-- Phase 11.4: панель действий для multi-select. Появляется
       над списком, когда selectMode=true. -->
  <div id="bulkBar" class="bulk-bar" hidden>
    <button id="bulkCancel" class="ghost" title="Отмена">✕</button>
    <span id="bulkCount">0 выбрано</span>
    <button id="bulkDone" title="Отметить выполненными">✓</button>
    <button id="bulkStar" title="Важные">★</button>
    <button id="bulkUnstar" title="Снять «важно»">☆</button>
    <button id="bulkMove" title="В список…">📁</button>
  </div>
  <ul id="list"></ul>
  <div id="empty" class="empty-state" hidden></div>
</section>

<!-- Phase 11.2: раздел заметок -->
<section id="notesSection" hidden>
  <div class="bar">
    <input id="searchNotes" placeholder="🔎 Поиск по заметкам…"
           autocomplete="off">
    <button id="newNoteBtn">+ Заметка</button>
  </div>
  <ul id="notesList" class="notes-grid"></ul>
  <div id="notesEmpty" class="empty-state" hidden></div>
</section>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;

// Phase 11.3/11.8: режим окна — широкое на десктопе, компактное на мобиле.
// Telegram WebApp.platform: 'tdesktop'/'macos'/'web'/'weba'/'webk'/'windows'
// /'linux' — десктоп; 'android'/'ios' — мобайл; 'unknown' — мобайл по умолч.
const DESKTOP_PLATFORMS = new Set(
  ["tdesktop", "macos", "web", "weba", "webk", "windows", "linux"]
);
const IS_DESKTOP = tg
  ? DESKTOP_PLATFORMS.has((tg.platform || "").toLowerCase())
  : false;

// Phase 11.13: двухуровневая стратегия fullscreen.
// 1) tg.requestFullscreen() — Bot API 8.0+ (Telegram Desktop 11.5+).
//    Преимущество: интегрирован с UI Telegram; работает корректно
//    в мобильном клиенте (там, по крайней мере, в теории — на iOS
//    fullscreen блокируется системой).
// 2) document.documentElement.requestFullscreen() — нативный браузерный
//    Fullscreen API. Telegram Desktop = Chromium-based, поэтому работает
//    всегда при наличии user-gesture (клика). Telegram Web — то же.
//    Не работает в iOS Safari/Telegram-iOS (Apple запрещает).
function _tgFsSupported() {
  if (!tg || typeof tg.requestFullscreen !== "function") return false;
  try {
    return tg.isVersionAtLeast ? tg.isVersionAtLeast("8.0") : true;
  } catch { return false; }
}
function _browserFsSupported() {
  return !!(document.documentElement.requestFullscreen ||
            document.documentElement.webkitRequestFullscreen);
}
function _browserFsActive() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
async function _enterFullscreen() {
  // Пробуем TG-нативный путь; если не поддержан или провалился —
  // браузерный API. Возвращает true, если хоть один путь сработал.
  if (_tgFsSupported()) {
    try { tg.requestFullscreen(); return true; }
    catch { /* fall through */ }
  }
  if (_browserFsSupported()) {
    try {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      await req.call(el);
      return true;
    } catch (e) {
      console.warn("[mini-app] browser fullscreen failed:", e);
      return false;
    }
  }
  return false;
}
async function _exitFullscreen() {
  if (_tgFsSupported() && tg.isFullscreen) {
    try { tg.exitFullscreen(); return true; }
    catch { /* fall through */ }
  }
  if (document.exitFullscreen) {
    try { await document.exitFullscreen(); return true; }
    catch { /* ignore */ }
  } else if (document.webkitExitFullscreen) {
    try { document.webkitExitFullscreen(); return true; }
    catch { /* ignore */ }
  }
  return false;
}
function _isFullscreen() {
  return (tg && tg.isFullscreen) || _browserFsActive();
}

function _setupWindowMode() {
  if (!tg) return;
  tg.ready();
  document.body.classList.add(IS_DESKTOP ? "is-desktop" : "is-mobile");

  if (IS_DESKTOP) {
    // На десктопе сразу максимизируем popup TG (expand).
    try { tg.expand(); } catch {}
    // tg.requestFullscreen() пытается, но без user-gesture часто
    // отказывает. Это OK — у пользователя есть кнопка ⛶, она
    // дёрнет fullscreen уже с реальным кликом (см. _enterFullscreen).
    if (_tgFsSupported()) {
      try { tg.requestFullscreen(); } catch {}
    }
  }

  try {
    console.log(
      "[mini-app] platform=%s ver=%s desktop=%s viewport=%s expanded=%s "
        + "tg_fs=%s tg_fs_supported=%s browser_fs_supported=%s",
      tg.platform, tg.version, IS_DESKTOP, tg.viewportHeight, tg.isExpanded,
      tg.isFullscreen, _tgFsSupported(), _browserFsSupported(),
    );
  } catch { /* SDK без этих полей — нет проблем */ }
}
_setupWindowMode();

// Phase 11.15: «псевдо-fullscreen» через CSS — последний резерв.
// Если ни TG, ни браузерный API не сработали (часто из-за iframe
// permissions policy), мы хотя бы максимизируем body внутри того окна,
// что Telegram нам выдал. Это не настоящий fullscreen, но визуально
// заполняет всё доступное место.
let _pseudoFs = false;
function _pseudoFsOn() {
  document.body.classList.add("pseudo-fs");
  _pseudoFs = true;
}
function _pseudoFsOff() {
  document.body.classList.remove("pseudo-fs");
  _pseudoFs = false;
}

function _updateFsButton() {
  const btn = document.getElementById("fsBtn");
  if (!btn || !IS_DESKTOP) return;
  // Phase 11.15: ВСЕГДА показываем на десктопе. Даже если все API
  // отказали — есть CSS-pseudo-fs как fallback, а пользователь
  // получит толковую диагностику.
  btn.hidden = false;
  const on = _isFullscreen() || _pseudoFs;
  btn.textContent = on ? "🗗" : "⛶";
  btn.title = on ? "Свернуть окно" : "Развернуть на весь экран";
}

function _setupFullscreenButton() {
  if (!IS_DESKTOP) return;
  const btn = document.getElementById("fsBtn");
  if (!btn) return;
  _updateFsButton();
  btn.onclick = async () => {
    // Если сейчас «в развёрнутом» — сворачиваем (все три варианта).
    if (_isFullscreen() || _pseudoFs) {
      let exited = false;
      if (_tgFsSupported() && tg.isFullscreen) {
        try { tg.exitFullscreen(); exited = true; } catch {}
      }
      if (_browserFsActive()) {
        try {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          exited = true;
        } catch {}
      }
      if (_pseudoFs) { _pseudoFsOff(); exited = true; }
      if (!exited) uiToast("Не удалось свернуть");
      setTimeout(_updateFsButton, 200);
      return;
    }

    // Развёртывание: пробуем по очереди, собираем причины отказов
    // в строку диагностики; ОДНА из попыток должна сработать.
    const tries = [];

    // 1) TG-нативный fullscreen.
    if (_tgFsSupported()) {
      try {
        tg.requestFullscreen();
        tries.push("tg → ok (ждём событие)");
        // Telegram должен поднять `fullscreenChanged`. Если за 350 мс
        // не поднял — считаем, что отказал, и идём дальше.
        await new Promise(r => setTimeout(r, 350));
        if (tg.isFullscreen) {
          setTimeout(_updateFsButton, 100);
          return;
        }
        tries[tries.length - 1] = "tg → ignored";
      } catch (e) {
        tries.push("tg → ex: " + (e.message || e));
      }
    } else {
      tries.push("tg fs not supported (need TG 11.5+)");
    }

    // 2) Браузерный Fullscreen API.
    if (_browserFsSupported()) {
      try {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        await req.call(el);
        tries.push("browser → ok");
        setTimeout(_updateFsButton, 100);
        return;
      } catch (e) {
        tries.push("browser → ex: " + (e.message || e));
      }
    } else {
      tries.push("browser fs API absent");
    }

    // 3) CSS pseudo-fullscreen — гарантированно работает, но это
    // максимизация ВНУТРИ окна Telegram (т.к. размер окна — за нами
    // не контролируем).
    _pseudoFsOn();
    _updateFsButton();
    uiToast(
      "Fullscreen API недоступен; применён CSS-режим. Шаги:\n" +
      tries.join("\n"),
    );
  };

  // Иконка синхронизируется с любым из трёх состояний.
  try {
    tg.onEvent("fullscreenChanged", _updateFsButton);
    tg.onEvent("fullscreenFailed", _updateFsButton);
  } catch { /* старый SDK */ }
  document.addEventListener("fullscreenchange", _updateFsButton);
  document.addEventListener("webkitfullscreenchange", _updateFsButton);
}

// initData читаем КАЖДЫЙ раз, а не один раз при загрузке: некоторые
// клиенты Telegram дозаполняют поле после `ready()` или после первого
// тика event loop.
function getInitData() {
  return tg ? (tg.initData || "") : "";
}
const INIT = getInitData();

// --- Модалы. Нативные window.alert/prompt/confirm в Telegram WebApp
// работают нестабильно (фокус не возвращается → менюшки «залипают»).
// Используем Telegram.WebApp.showAlert/showPopup, для ввода — кастомный
// inline-overlay. Все вызовы — Promise-based, без callback hell.

function uiAlert(message){
  return new Promise(resolve => {
    if (tg && tg.showAlert) tg.showAlert(String(message), () => resolve());
    else { window.alert(message); resolve(); }
  });
}

function uiConfirm(message){
  return new Promise(resolve => {
    if (tg && tg.showConfirm) tg.showConfirm(String(message), ok => resolve(!!ok));
    else resolve(window.confirm(message));
  });
}

function uiPrompt(title, defaultValue=""){
  // У TG WebApp нет нативного prompt — рисуем оверлей с input + двумя
  // кнопками. Промис разрешается значением или null (cancel).
  return new Promise(resolve => {
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML =
      `<div class="modal">
         <div class="modal-title">${String(title)
           .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",
                                      ">":"&gt;",'"':"&quot;"}[c]))}</div>
         <input class="modal-input" type="text">
         <div class="modal-btns">
           <button class="ghost modal-cancel">Отмена</button>
           <button class="modal-ok">OK</button>
         </div>
       </div>`;
    document.body.appendChild(back);
    const inp = back.querySelector(".modal-input");
    inp.value = defaultValue || "";
    const close = (val) => {
      if (back.parentNode) back.parentNode.removeChild(back);
      resolve(val);
    };
    back.querySelector(".modal-cancel").onclick = () => close(null);
    back.querySelector(".modal-ok").onclick = () => close(inp.value);
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") close(inp.value);
      else if (e.key === "Escape") close(null);
    });
    // Если пользователь нажал Telegram BackButton — отмена.
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      const off = () => { tg.BackButton.hide(); tg.offEvent("backButtonClicked", off);
                          close(null); };
      tg.onEvent("backButtonClicked", off);
    }
    setTimeout(() => inp.focus(), 30);
  });
}

function uiSelect(title, options, current=null) {
  // options: [{value, label, group?}]. Группы рендерятся как заголовки.
  // current — value текущего выбранного (подсвечивается).
  // Resolves: chosen value | null on cancel.
  return new Promise(resolve => {
    const esc = s => String(s).replace(/[&<>"]/g,
      c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const back = document.createElement("div");
    back.className = "modal-back";
    let body = "";
    let lastGroup = null;
    for (const o of options) {
      if (o.group && o.group !== lastGroup) {
        body += `<div class="modal-group">${esc(o.group)}</div>`;
        lastGroup = o.group;
      }
      const sel = current != null && String(o.value) === String(current);
      body += `<div class="modal-item${sel ? ' sel' : ''}" `
            + `data-val="${esc(o.value)}">${esc(o.label)}</div>`;
    }
    back.innerHTML =
      `<div class="modal modal-list">
         <div class="modal-title">${esc(title)}</div>
         <div class="modal-search-wrap">
           <input class="modal-input modal-search" placeholder="🔎 Поиск…">
         </div>
         <div class="modal-items">${body}</div>
         <div class="modal-btns">
           <button class="ghost modal-cancel">Отмена</button>
         </div>
       </div>`;
    document.body.appendChild(back);
    const close = (val) => {
      if (back.parentNode) back.parentNode.removeChild(back);
      resolve(val);
    };
    back.querySelector(".modal-cancel").onclick = () => close(null);
    back.querySelectorAll(".modal-item").forEach(el =>
      el.onclick = () => close(el.dataset.val));
    // Поиск: фильтрует по подстроке (case-insensitive).
    const search = back.querySelector(".modal-search");
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      back.querySelectorAll(".modal-item").forEach(el => {
        el.style.display =
          (!q || el.textContent.toLowerCase().includes(q)) ? "" : "none";
      });
      // Скрываем заголовок группы, если все её элементы скрыты.
      back.querySelectorAll(".modal-group").forEach(g => {
        let next = g.nextElementSibling;
        let any = false;
        while (next && next.classList.contains("modal-item")) {
          if (next.style.display !== "none") { any = true; break; }
          next = next.nextElementSibling;
        }
        g.style.display = any ? "" : "none";
      });
    });
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      const off = () => {
        tg.BackButton.hide();
        tg.offEvent("backButtonClicked", off);
        close(null);
      };
      tg.onEvent("backButtonClicked", off);
    }
    setTimeout(() => search.focus(), 30);
  });
}

// Лёгкий тост — не блокирует UI, не использует нативный alert.
function uiToast(msg, kind = "err") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.textContent = String(msg);
  document.body.appendChild(t);
  // Анимируем через requestAnimationFrame, чтобы успел применить transition.
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => {
    t.classList.remove("show");
    setTimeout(() => t.parentNode && t.parentNode.removeChild(t), 250);
  }, 4000);
}

// Phase 10.7: тост с кнопкой действия («Отменить»). Закрывается либо
// по клику на кнопку (выполняется action), либо по таймауту.
function uiUndoToast(msg, action, ms = 6000) {
  const esc = s => String(s).replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const t = document.createElement("div");
  t.className = "toast undo";
  t.innerHTML =
    `<span>${esc(msg)}</span>
     <button class="toast-action">Отменить</button>`;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  let done = false;
  const close = async (act) => {
    if (done) return;
    done = true;
    t.classList.remove("show");
    setTimeout(() => t.parentNode && t.parentNode.removeChild(t), 250);
    if (act) {
      try { await action(); } catch (e) { uiToast(String(e.message || e)); }
    }
  };
  t.querySelector(".toast-action").onclick = () => close(true);
  setTimeout(() => close(false), ms);
}

async function api(path, opts={}) {
  let r;
  try {
    r = await fetch("/api" + path, {
      ...opts,
      headers: {
        "Content-Type": "application/json",
        // Перечитываем initData при каждом запросе (Phase 11.3): на
        // некоторых клиентах TG поле дозаполняется уже после первого
        // тика; снимок при загрузке мог быть пустым.
        "X-Init-Data": getInitData() || INIT,
        ...(opts.headers || {}),
      },
    });
  } catch (e) {
    // Сеть/CORS/DNS — на этом этапе response ещё не получили.
    if (!opts._silent) uiToast("Нет сети: " + (e && e.message || e));
    throw e;
  }
  if (r.status === 401) {
    // Phase 11.3: вместо пустого «Откройте из Telegram» — даём
    // диагностику. Чаще всего issue в одной из двух точек:
    //   1) initData пуст → запустили вне Telegram
    //   2) hash mismatch → токен в .env не совпадает с подписью TG
    //      (бот пересоздавался, .env не обновили)
    const initLen = (getInitData() || "").length;
    const platform = tg ? (tg.platform || "?") : "no-tg";
    document.body.innerHTML =
      '<div class="muted" style="text-align:left;padding:24px">' +
      '<b>Не получилось авторизоваться (401).</b><br><br>' +
      'Проверьте:<br>' +
      '• Открыли Mini App через кнопку в чате с ботом<br>' +
      '• На сервере в <code>.env</code> правильный <code>TELEGRAM_BOT_TOKEN</code><br>' +
      '• Ваш telegram-id есть в <code>ALLOWED_USER_IDS</code><br><br>' +
      '<small>platform: ' + platform + ' · initData length: ' + initLen + '</small>' +
      '</div>';
    throw new Error("unauthorized");
  }
  if (r.status === 403) {
    document.body.innerHTML =
      '<div class="muted" style="padding:24px">' +
      '<b>Доступ запрещён.</b><br><br>' +
      'Этот бот ограничен по списку пользователей. Если это ваш бот — ' +
      'добавьте свой telegram-id в <code>ALLOWED_USER_IDS</code> в ' +
      '<code>.env</code> и перезапустите <code>bot_webapp</code>.' +
      '</div>';
    throw new Error("forbidden");
  }
  if (r.status === 204) return null;
  // 5xx / 4xx (кроме 401) — показываем серверный detail, иначе сам код.
  if (!r.ok && !opts._silent) {
    let detail = `HTTP ${r.status}`;
    try {
      const body = await r.clone().json();
      if (body && body.detail) detail = body.detail;
    } catch { /* не JSON — оставляем код */ }
    uiToast("Ошибка: " + detail);
  }
  return r.json().catch(() => null);
}

const $ = (s, el=document) => el.querySelector(s);

// --- Сохраняемое состояние UI (Phase 10.4): чтобы при повторном
// открытии Mini App пользователя ждал тот же список и view, что был.
// localStorage в Telegram WebApp работает; для приватности — ключи
// с user_id-prefix не нужны, т.к. у каждого пользователя свой WebView.
const _LS_KEY = "bot_reminder_ui";
function loadUI() {
  try { return JSON.parse(localStorage.getItem(_LS_KEY) || "{}"); }
  catch { return {}; }
}
function saveUI(patch) {
  const cur = loadUI();
  Object.assign(cur, patch);
  try { localStorage.setItem(_LS_KEY, JSON.stringify(cur)); } catch {}
}
const _UI = loadUI();
let listId = _UI.listId || "all";

function fmt(dt){ return dt ? dt.replace("T"," ").slice(0,16) : ""; }
function toInput(s){ return s ? s.slice(0,16).replace(" ","T") : ""; }

let LISTS = [];
async function loadLists(){
  const sel = $("#listSel");
  const lists = await api("/lists");
  LISTS = lists;
  sel.innerHTML =
    '<option value="all">Все задачи</option>' +
    '<option value="0">Без списка</option>' +
    lists.map(l => {
      const c = l.color || "#0088CC";
      return `<option value="${l.id}" style="color:${c}">● ${esc(l.name)}</option>`;
    }).join("");
  sel.value = listId;
  // Phase 11.14: synchronize the sidebar drawer.
  if (typeof renderDrawerLists === "function") {
    try { renderDrawerLists(); } catch {}
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// Phase 11.16: тонко-настроенные empty-state'ы для каждого вида.
// Большая эмодзи-иллюстрация + заголовок + подсказка, что делать.
function _emptyHtmlForTasks(searchQuery, view) {
  if (searchQuery) {
    return _emptyTemplate("🔎", "Ничего не найдено",
      `По запросу «${esc(searchQuery)}» задач нет. Попробуйте другие слова.`);
  }
  switch (view) {
    case "myday":
      return _emptyTemplate("☀️", "Сегодня свободно",
        "Добавьте задачу с сегодняшним сроком, или закрепите существующую в «Мой день» из её панели.");
    case "planned":
      return _emptyTemplate("📅", "Нет планов",
        "Здесь будут задачи со сроком или напоминанием. Установите дату — задача попадёт сюда автоматически.");
    case "important":
      return _emptyTemplate("⭐", "Нет важных",
        "Нажмите ★ рядом с задачей, чтобы пометить её важной — она появится в этом виде.");
    case "archive":
      return _emptyTemplate("🗂", "Архив пуст",
        "Выполненные задачи появятся здесь. Чтобы вернуть, откройте задачу и снимите галочку.");
    default:
      return _emptyTemplate("✨", "Пока нет задач",
        "Добавьте первую задачу в поле выше — или потяните ≡ влево, чтобы выбрать список.");
  }
}

function _emptyTemplate(icon, title, hint) {
  return `<div class="empty-icon">${icon}</div>
          <div class="empty-title">${esc(title)}</div>
          <div class="empty-hint">${esc(hint)}</div>`;
}

async function load(){
  let tasks;
  const sq = $("#search").value.trim();
  const view = $("#viewSel").value;
  if (sq) {
    tasks = await api("/tasks?search=" + encodeURIComponent(sq));
  } else if (view === "myday") {
    tasks = await api("/myday");
  } else if (view === "planned") {
    tasks = await api("/planned");
  } else if (view === "important") {
    tasks = await api("/important");
  } else if (view === "archive") {
    tasks = await api("/archive");
  } else {
    let q = "?completed=" + ($("#showDone").checked ? "true" : "false");
    if (listId !== "all") q += "&list_id=" + listId;
    const s = $("#sortSel").value;
    if (s) q += "&sort=" + s;
    tasks = await api("/tasks" + q);
  }
  const ul = $("#list"); ul.innerHTML = "";
  const emptyEl = $("#empty");
  if (tasks.length === 0) {
    emptyEl.hidden = false;
    emptyEl.innerHTML = _emptyHtmlForTasks(sq, view);
  } else {
    emptyEl.hidden = true;
  }
  for (const t of tasks) ul.appendChild(row(t));
  // Drag-and-drop включаем только в режимах, где порядок реально
  // соответствует order_index — это «Все» (без поиска) и «по списку».
  // В smart-views (myday/planned/important) и при поиске список
  // отсортирован по другим критериям, drag сбил бы порядок.
  const dragEnabled = !sq &&
    !["myday","planned","important","archive"].includes(view) &&
    !$("#sortSel").value;
  if (dragEnabled) attachDragDrop(ul);
  refreshStats();
  // Phase 11.4: после повторного рендера восстанавливаем подсветку
  // выделенных задач (id могут переехать в смежных тасках при
  // редактировании, но базово set остаётся в силе).
  if (selectMode) refreshSelectionUI();
}

// Phase 10.8: маленький значок в шапке. Обновляется после load() и
// после изменений, влияющих на счётчики. Не блокирует первый
// рендер: load() показывает задачи синхронно, бэйдж подтягивается
// следом.

  try {
    const s = await api("/stats", {_silent: true});
    const badge = $("#statsBadge");

}

// --- Phase 11.4: multi-select / bulk actions ---

let selectMode = false;
const selectedIds = new Set();

function enterSelectMode(firstId) {
  selectMode = true;
  selectedIds.clear();
  if (firstId != null) selectedIds.add(firstId);
  document.body.classList.add("select-mode");
  $("#bulkBar").hidden = false;
  // Закрываем все открытые панели задач, чтобы не путались.
  document.querySelectorAll(".panel.open").forEach(p =>
    p.classList.remove("open"));
  refreshSelectionUI();
}

function exitSelectMode() {
  selectMode = false;
  selectedIds.clear();
  document.body.classList.remove("select-mode");
  $("#bulkBar").hidden = true;
  document.querySelectorAll("li.li-sel").forEach(el =>
    el.classList.remove("li-sel"));
}

function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  if (selectedIds.size === 0) { exitSelectMode(); return; }
  refreshSelectionUI();
}

function refreshSelectionUI() {
  document.querySelectorAll("#list li").forEach(el => {
    const id = parseInt(el.dataset.id, 10);
    el.classList.toggle("li-sel", selectedIds.has(id));
  });
  $("#bulkCount").textContent = `${selectedIds.size} выбрано`;
}

async function bulkAction(action, extra = {}) {
  if (!selectedIds.size) return;
  const body = {ids: [...selectedIds], action, ...extra};
  await api("/tasks/bulk", {method: "POST", body: JSON.stringify(body)});
  exitSelectMode();
  load();
}

$("#bulkCancel").onclick = exitSelectMode;
$("#bulkDone").onclick = () => bulkAction("complete");
$("#bulkStar").onclick = () => bulkAction("star");
$("#bulkUnstar").onclick = () => bulkAction("unstar");
$("#bulkMove").onclick = async () => {
  // Используем uiSelect (есть с Phase 10.5) для выбора списка.
  const opts = [{value: "0", label: "📭 Без списка"}].concat(
    LISTS.map(l => ({value: String(l.id), label: l.name, group: ""}))
  );
  const picked = await uiSelect("Переместить в список", opts);
  if (picked === null) return;
  const list_id = picked === "0" ? null : parseInt(picked, 10);
  await bulkAction("move", {list_id});
};

function attachDragDrop(ul){
  // Pointer Events: единый код для мыши и тач-экранов. HTML5 native
  // draggable плохо работает на мобиле, поэтому собираем вручную.
  // Логика: на pointerdown по .drag-handle захватываем pointer-capture,
  // на move — отмечаем, над какой li мы (выше/ниже середины), на up —
  // POST /reorder с `after` = id предыдущей li (или null если перед
  // первой).
  ul.querySelectorAll(".drag-handle").forEach(handle => {
    handle.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      const li = handle.closest("li");
      if (!li) return;
      handle.setPointerCapture(ev.pointerId);
      li.classList.add("dragging");
      let target = null;     // li, над которой мы сейчас
      let pos = null;        // "above" | "below"

      const clearMarks = () => {
        ul.querySelectorAll("li.drop-above,li.drop-below").forEach(el => {
          el.classList.remove("drop-above","drop-below");
        });
      };

      const onMove = (e) => {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const hover = el && el.closest && el.closest("li");
        if (!hover || hover === li || hover.parentNode !== ul) {
          clearMarks();
          target = null;
          return;
        }
        const r = hover.getBoundingClientRect();
        const above = (e.clientY - r.top) < r.height / 2;
        clearMarks();
        hover.classList.add(above ? "drop-above" : "drop-below");
        target = hover;
        pos = above ? "above" : "below";
      };

      const onUp = async () => {
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
        handle.removeEventListener("pointercancel", onUp);
        clearMarks();
        li.classList.remove("dragging");
        if (!target) return;
        // after_id — id предыдущей li относительно нового положения.
        let afterId = null;
        if (pos === "above") {
          // вставка перед target: после предыдущей сестры target
          const prev = target.previousElementSibling;
          // если предыдущая — сама `li` (мы перетаскиваем её), то
          // позиция «перед target» эквивалентна текущей.
          if (prev && prev !== li) afterId = parseInt(prev.dataset.id, 10);
          else if (prev === li) {
            // уже на нужной позиции — не дёргаем сервер
            return;
          }
          else afterId = null;
        } else {
          afterId = parseInt(target.dataset.id, 10);
        }
        // Оптимистично: переставляем DOM локально, затем дёргаем API.
        if (pos === "above") ul.insertBefore(li, target);
        else target.parentNode.insertBefore(li, target.nextSibling);
        const id = parseInt(li.dataset.id, 10);
        try {
          await api(`/tasks/${id}/reorder`, {method:"POST",
            body: JSON.stringify({after: afterId})});
        } catch {
          load();    // на ошибке — синхронизируемся с сервером
        }
      };

      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
      handle.addEventListener("pointercancel", onUp);
    });
  });
}

// Phase 11.7: inline-edit заголовка задачи. Двойной клик на `.ttl`
// подменяет текст на <input>; Enter / blur сохраняет, Escape отменяет.
function inlineEditTitle(li, t) {
  const ttl = li.querySelector(".ttl");
  if (!ttl) return;
  const meta = ttl.querySelector(".meta");
  const metaHTML = meta ? meta.outerHTML : "";
  const orig = t.description;
  li.classList.add("editing");
  // Сохраняем и закрываем панель, если она была открыта — текст
  // дублируется в `.f-desc` внутри панели, чтобы не путаться.
  const panel = li.querySelector(".panel");
  if (panel) panel.classList.remove("open");

  const inp = document.createElement("input");
  inp.type = "text";
  inp.className = "edit-title";
  inp.value = orig;
  inp.maxLength = 500;
  // Заменяем текст на input, оставляя .meta под ним.
  ttl.innerHTML = "";
  ttl.appendChild(inp);
  if (metaHTML) ttl.insertAdjacentHTML("beforeend", metaHTML);
  setTimeout(() => { inp.focus(); inp.select(); }, 10);

  let done = false;
  const finish = async (commit) => {
    if (done) return;
    done = true;
    const v = inp.value.trim();
    li.classList.remove("editing");
    if (!commit || !v || v === orig) {
      load();   // просто перерисовываем — input исчезнет
      return;
    }
    await api(`/tasks/${t.id}`, {method:"PATCH",
      body: JSON.stringify({description: v})});
    load();
  };
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
  inp.addEventListener("blur", () => finish(true));
}

          </select>
        </div>
        <div class="ckrow">
          <label><input type="radio" name="rcm_${t.id}" class="f-rcm"
                 value="weekdays"> По дням недели</label>
          <span class="wd">
            <label><input type="checkbox" class="f-wd" value="MO">Пн</label>
            <label><input type="checkbox" class="f-wd" value="TU">Вт</label>
            <label><input type="checkbox" class="f-wd" value="WE">Ср</label>
            <label><input type="checkbox" class="f-wd" value="TH">Чт</label>
            <label><input type="checkbox" class="f-wd" value="FR">Пт</label>
            <label><input type="checkbox" class="f-wd" value="SA">Сб</label>
            <label><input type="checkbox" class="f-wd" value="SU">Вс</label>

      </div>
      <label>Список
        <select class="f-list">
          <option value="0">Без списка</option>
          ${LISTS.map(l => `<option value="${l.id}">${

        </select>
      </label>
      <label>Заметка<textarea class="f-notes">${esc(t.notes||"")}</textarea></label>
      <div class="steps" data-loaded="0"></div>
      <div class="addstep">
        <input class="f-step" placeholder="Новая подзадача…">
        <button class="ghost" data-act="addstep">+ шаг</button>

      <div class="pbtns">
        <button data-act="save">Сохранить</button>

        <button class="ghost" data-act="clr-dl">Убрать срок</button>

        <button class="ghost danger" data-act="del-task" title="Удалить задачу">🗑 Удалить</button>

  const meta = [];

  if (t.myday_date) meta.push("в «Мой день»");

  const r = t.recurrence || "";

  let mWeek = r.match(/^weekdays:([A-Z,]+)$/);

      const wd = new Set(mWeek[1].split(","));
      li.querySelectorAll(".f-wd").forEach(c => c.checked = wd.has(c.value));
    }
  }
  recSel.onchange = () => { cust.hidden = recSel.value !== "custom"; };
  $(".f-list", li).value = t.list_id ? String(t.list_id) : "0";

  async function refreshSteps(){
    const box = $(".steps", li);
    const steps = await api(`/tasks/${t.id}/steps`);
    box.dataset.loaded = "1";
    box.innerHTML = steps.map(s => `
      <div class="step" data-sid="${s.id}">
        <span class="schk ${s.completed?'done':''}" data-act="stoggle"
              data-done="${s.completed?1:0}"></span>
        <span class="${s.completed?'sdone':''}">${esc(s.description)}</span>
        <button class="ghost sdel" data-act="sdel">✕</button>
      </div>`).join("");
  }

  $(".ttl", li).onclick = (e) => {
    // Phase 11.4: в режиме мульти-выбора клик по тексту тоже toggle'ит.
    if (selectMode) {
      e.preventDefault();
      e.stopPropagation();
      toggleSelect(t.id);
      return;
    }
    // Если уже в режиме inline-edit — клик внутри input не должен
    // закрывать панель или что-то делать.
    if (li.classList.contains("editing")) return;
    const p = $(".panel", li);
    p.classList.toggle("open");
    if (p.classList.contains("open") &&
        $(".steps", li).dataset.loaded === "0") refreshSteps();
  };
  // Phase 11.7: двойной клик → inline-редактирование описания.
  $(".ttl", li).addEventListener("dblclick", (e) => {
    if (selectMode || li.classList.contains("editing")) return;
    e.preventDefault();
    e.stopPropagation();
    inlineEditTitle(li, t);
  });
  // Phase 11.4: long-press по `.ttl` → вход в режим мульти-выбора.
  let _lpTimer = null;
  let _lpX = 0, _lpY = 0;
  const _ttl = $(".ttl", li);
  _ttl.addEventListener("pointerdown", (e) => {
    if (selectMode) return;
    _lpX = e.clientX; _lpY = e.clientY;
    _lpTimer = setTimeout(() => {
      _lpTimer = null;
      if (tg && tg.HapticFeedback) {
        try { tg.HapticFeedback.impactOccurred("medium"); } catch {}
      }
      enterSelectMode(t.id);
    }, 500);
  });
  const _cancelLP = (e) => {
    if (_lpTimer && e && (Math.abs(e.clientX - _lpX) > 10 ||
                          Math.abs(e.clientY - _lpY) > 10)) {
      clearTimeout(_lpTimer); _lpTimer = null;
    }
  };
  _ttl.addEventListener("pointermove", _cancelLP);
  _ttl.addEventListener("pointerup", () => {
    if (_lpTimer) { clearTimeout(_lpTimer); _lpTimer = null; }
  });
  _ttl.addEventListener("pointercancel", () => {
    if (_lpTimer) { clearTimeout(_lpTimer); _lpTimer = null; }
  });

  li._refreshSteps = refreshSteps;
  li.addEventListener("click", async (e) => {
    // Phase 11.4: в режиме мульти-выбора игнорируем кнопки-действия,
    // любой клик по строке = toggle selection (если не по .ttl, который
    // уже сам обработан выше).
    if (selectMode) {
      if (!e.target.closest(".ttl")) {
        e.preventDefault();
        toggleSelect(t.id);
      }
      return;
    }
    const act = e.target.dataset.act;
    if (!act) return;
    if (act === "toggle") {
      // Phase 11.16: при «выполнить» — короткая анимация перед load().
      // При «вернуть в активные» — без анимации (визуально она тут вредна).
      const completing = !t.completed;
      if (completing) li.classList.add("completing");
      const apiCall = api(
        `/tasks/${t.id}/${t.completed ? 'uncomplete' : 'complete'}`,
        {method: "POST"},
      );
      if (completing) {
        // Параллельно: ждём 350 мс анимации И HTTP-ответ.
        await Promise.all([
          apiCall,
          new Promise(r => setTimeout(r, 350)),
        ]);
      } else {
        await apiCall;
      }
      load();
    } else if (act === "star") {
      await api(`/tasks/${t.id}`, {method:"PATCH",
        body: JSON.stringify({important: !t.important})});
      load();
    } else if (act === "save") {
      let rec = $(".f-rec",li).value;
      if (rec === "custom") {
        const mode = li.querySelector(".f-rcm:checked")?.value;
        if (mode === "weekdays") {
          const days = [...li.querySelectorAll(".f-wd:checked")]
            .map(c => c.value);
          if (!days.length) { await uiAlert("Выберите хотя бы один день"); return; }
          rec = "weekdays:" + days.join(",");
        } else {
          const n = parseInt($(".f-rcn",li).value, 10);
          if (!(n >= 1)) { await uiAlert("N должно быть ≥ 1"); return; }
          rec = "every:" + n + ":" + $(".f-rcu",li).value;
        }
      }
      const notes = $(".f-notes",li).value;
      await api(`/tasks/${t.id}`, {method:"PATCH", body: JSON.stringify({
        description: $(".f-desc",li).value,
        deadline: fmt($(".f-dl",li).value) || null,
        reminder_at: fmt($(".f-rm",li).value) || null,
        ...(rec ? {recurrence: rec} : {clear_recurrence: true}),
        ...(notes.trim() ? {notes: notes} : {clear_notes: true}),
      })});
      await api(`/tasks/${t.id}/list`, {method:"POST", body: JSON.stringify(
        {list_id: Number($(".f-list",li).value) || null})});
      load();
    } else if (act === "addstep") {
      const inp = $(".f-step", li);
      if (inp.value.trim()) {
        await api(`/tasks/${t.id}/steps`, {method:"POST",
          body: JSON.stringify({description: inp.value.trim()})});
        inp.value = "";
        li._refreshSteps();
      }
    } else if (act === "stoggle") {
      const st = e.target.closest(".step");
      await api(`/tasks/${t.id}/steps/${st.dataset.sid}/toggle`,
        {method:"POST", body: JSON.stringify(
          {done: e.target.dataset.done !== "1"})});
      li._refreshSteps();
    } else if (act === "sdel") {
      const st = e.target.closest(".step");
      await api(`/tasks/${t.id}/steps/${st.dataset.sid}`,
        {method:"DELETE"});
      li._refreshSteps();
    } else if (act === "myday") {
      await api(`/tasks/${t.id}/myday`, {method:"POST",
        body: JSON.stringify({on: !t.myday_date})});
      load();
    } else if (act === "snooze") {
      let m = e.target.dataset.min;
      if (m === "tomorrow") {
        const n = new Date();
        const tmr = new Date(n.getFullYear(), n.getMonth(),
                             n.getDate() + 1, 9, 0, 0);
        m = Math.max(1, Math.round((tmr - n) / 60000));
      } else {
        m = parseInt(m, 10);
      }
      await api(`/tasks/${t.id}/snooze`, {method:"POST",
        body: JSON.stringify({minutes: m})});
      load();
    } else if (act === "clr-dl") {
      await api(`/tasks/${t.id}`, {method:"PATCH",
        body: JSON.stringify({clear_deadline:true})}); load();
    } else if (act === "clr-rm") {
      await api(`/tasks/${t.id}`, {method:"PATCH",
        body: JSON.stringify({clear_reminder:true})}); load();
    } else if (act === "mv-up") {
      await api(`/tasks/${t.id}/move-up`, {method:"POST"});
      load();
    } else if (act === "mv-down") {
      await api(`/tasks/${t.id}/move-down`, {method:"POST"});
      load();
    } else if (act === "pick-note") {
      // Phase 11.6: выбираем заметку из текущих (фильтруем soft-deleted
      // на бэкенде через GET /api/notes — он уже их прячет).
      const notes = await api("/notes");
      if (!notes.length) {
        await uiAlert("Заметок ещё нет. Создайте заметку в разделе 📓 Заметки.");
        return;
      }
      const opts = notes.map(n => ({
        value: String(n.id),
        label: (n.title || n.body || "(без названия)").slice(0, 80),
      }));
      const picked = await uiSelect(
        "Прикрепить заметку", opts, t.note_id ? String(t.note_id) : null
      );
      if (picked === null) return;
      await api(`/tasks/${t.id}`, {method:"PATCH",
        body: JSON.stringify({note_id: parseInt(picked, 10)})});
      load();
    } else if (act === "clr-note") {
      await api(`/tasks/${t.id}`, {method:"PATCH",
        body: JSON.stringify({clear_note: true})});
      load();
    } else if (act === "del-task") {
      // Phase 11.10: soft-delete + undo (8 сек). Описание задачи —
      // в тосте, чтобы было понятно, что именно удалено.
      await api(`/tasks/${t.id}`, {method:"DELETE"});
      load();
      const preview = (t.description || "").slice(0, 50);
      uiUndoToast(
        `Задача удалена: «${preview}»`,
        async () => {
          await api(`/tasks/${t.id}/restore`, {method:"POST"});
          load();
          uiToast("Задача восстановлена", "ok");
        },
        8000,
      );
    }
  });
  return li;
}

$("#clrList").onclick = async () => {
  const id = curListId();
  if (!id) { await uiAlert("Сначала выберите список в выпадающем меню"); return; }
  const cur = (LISTS.find(l => String(l.id) === String(id)) || {}).color
              || "#0088CC";
  // Скрытый <input type="color"> — нативный пикер. На случай отмены
  // (нет события change) — удаляем узел через blur и не оставляем
  // мёртвых элементов в DOM (от которых, теоретически, могла «залипать»
  // менюшка при повторных открытиях).
  const inp = document.createElement("input");
  inp.type = "color"; inp.value = cur;
  inp.style.position = "absolute"; inp.style.opacity = "0";
  inp.style.left = "-9999px";
  document.body.appendChild(inp);
  const cleanup = () => { if (inp.parentNode) inp.parentNode.removeChild(inp); };
  inp.addEventListener("change", async () => {
    const color = inp.value;
    cleanup();
    if (!color || color === cur) return;
    await api(`/lists/${id}`, {method:"PATCH",
      body: JSON.stringify({color: color})});
    await loadLists(); load();
  }, {once: true});
  // Подстраховка от утечки, если событие change не пришло.
  inp.addEventListener("blur", cleanup, {once: true});
  setTimeout(cleanup, 60_000);   // финальный «гарантированный» прибор
  inp.click();
};

// Phase 11.5: безопасный markdown-рендерер для тела заметки.
// Hand-rolled, без зависимостей. ВАЖНО: работает только над УЖЕ
// заэскейпленной строкой (`esc(text)` сначала превращает <,>,&,",
// > в HTML-сущности). После эскейпа все «&lt;b&gt;» — обычный текст,
// нет XSS-вектора. Поверх него мы вставляем только наши теги.
//
// Поддерживается:
//   **bold**, __bold__
//   *italic*, _italic_
//   `inline code`
//   [text](url)              — http(s) и t.me/, иначе показываем без ссылки
//   автоссылки http(s)://… и t.me/…
//   - [ ] / - [x]            — чек-лист (визуально; для редактирования —
//                              в textarea остаётся сырой markdown)
//   обычные переносы строк → <br>
function mdToHtml(raw) {
  if (!raw) return "";
  // 1) Экранируем всю строку целиком — никаких сюрпризов от пользователя.
  let s = esc(raw);
  // 2) Чек-листы `- [ ] …` / `- [x] …`. Один общий regex; присваиваем
  //    каждому чек-боксу последовательный `data-cb` (Phase 11.9) — по
  //    нему JS-обработчик найдёт и перевернёт нужную строку в исходном
  //    `raw`.
  let cbIdx = -1;
  s = s.replace(/^(\s*)- \[([ xX])\] (.*)$/gm, (_m, sp, state, rest) => {
    cbIdx++;
    const checked = state.toLowerCase() === "x";
    const cls = "md-cb" + (checked ? " md-cb-on" : "");
    const icon = checked ? "☑" : "☐";
    const body = checked
      ? `<span class="md-done">${rest}</span>`
      : rest;
    return `${sp}<span class="${cls}" data-cb="${cbIdx}">${icon}</span> ${body}`;
  });
  // 3) Inline code `…` — раньше других, чтобы внутри не парсилось.
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 4) [text](url) — только безопасные схемы.
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, text, url) => {
    if (/^(https?:\/\/|tg:\/\/|\/|mailto:)/i.test(url)) {
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;
    }
    return text + " (" + url + ")";   // небезопасная ссылка — показываем как текст
  });
  // 5) Автоссылки (только если ещё не внутри тега `<a>`). Простой
  //    эвристический подход: ищем URL вне «>…<» — но проще пометить
  //    уже вставленные <a> и не трогать.
  // Для упрощения: сначала вынесем существующие <a …>текст</a> в плейсхолдеры.
  const stash = [];
  s = s.replace(/<a [^>]+>[^<]+<\/a>/g, (m) => {
    stash.push(m);
    return `${stash.length - 1}`;
  });
  s = s.replace(
    /\b((?:https?:\/\/|tg:\/\/)[\w\-.~:/?#\[\]@!$&'()*+,;=%]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>',
  );
  // Возвращаем плейсхолдеры обратно.
  s = s.replace(/(\d+)/g, (m, i) => stash[parseInt(i, 10)]);
  // 6) **bold** / __bold__
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/__([^_\n]+)__/g, '<b>$1</b>');
  // 7) *italic* / _italic_ — после bold, чтобы не съесть **
  s = s.replace(/(^|[^\*])\*([^*\n]+)\*(?!\*)/g, '$1<i>$2</i>');
  s = s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<i>$2</i>');
  // 8) Переносы строк.
  s = s.replace(/\n/g, "<br>");
  return s;
}

// Phase 11.9: переключает `cbIdx`-й чек-бокс в `body`. Возвращает
// новое тело или null, если такого чек-бокса нет (рассинхрон рендера).
function toggleNoteCheckboxLine(body, cbIdx) {
  let count = 0;
  const lines = String(body || "").split("\n");
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^(\s*- \[)([ xX])(\] .*)$/);
    if (!m) continue;
    if (count === cbIdx) {
      const next = m[2].toLowerCase() === "x" ? " " : "x";
      lines[i] = m[1] + next + m[3];
      return lines.join("\n");
    }
    count++;
  }
  return null;
}

function noteCard(n) {
  const li = document.createElement("li");
  li.className = "note" + (n.pinned ? " pinned" : "");
  li.style.background = n.color || "#FEF3C7";
  // Цвет фона — пастель; текст всегда чёрный для контраста.
  li.style.color = "#111827";
  li.innerHTML =
    (n.pinned ? '<span class="npin" title="Закреплено">📌</span>' : '')
    + (n.title ? `<div class="ntitle">${esc(n.title)}</div>` : '')
    + `<div class="nbody md">${mdToHtml(n.body)}</div>`
    + `<div class="nmeta">${shortDate(n.updated_at || n.created_at)}</div>`;
  li.onclick = (e) => {
    // Phase 11.9: клик по чек-боксу → toggle прямо из карточки,
    // редактор НЕ открываем. Любой другой клик — открыть редактор.
    const cb = e.target && e.target.closest && e.target.closest(".md-cb");
    if (cb && cb.dataset.cb != null) {
      e.stopPropagation();
      const idx = parseInt(cb.dataset.cb, 10);
      const next = toggleNoteCheckboxLine(n.body, idx);
      if (next == null) return;
      // Оптимистично: обновляем содержимое в state + перерисуем карточку.
      n.body = next;
      // Обновляем DOM без перезагрузки всей сетки — быстро и без мерцания.
      const md = li.querySelector(".nbody.md");
      if (md) md.innerHTML = mdToHtml(next);
      // Сохраняем на сервер; на ошибке — load() синхронизирует.
      api(`/notes/${n.id}`, {method:"PATCH",
        body: JSON.stringify({body: next}), _silent: true})
        .catch(() => loadNotes());
      return;
    }
    openNoteEditor(n);
  };
  return li;
}

function shortDate(s) {
  if (!s) return "";
  try {
    const d = new Date(s.replace(" ", "T") + "Z");
    return d.toLocaleString(undefined, {dateStyle:"short", timeStyle:"short"});
  } catch { return s; }
}

$("#newNoteBtn").onclick = () => openNoteEditor(null);

// Кастомный модал-редактор: заголовок, тело, цвет, кнопка-закрепить,
// удалить (с undo), сохранить.
function openNoteEditor(note) {
  const isNew = note === null;
  const cur = note || {title: "", body: "", color: NOTE_COLORS[0],
                       pinned: false};
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML =
    `<div class="modal note-editor">
       <div class="modal-title">${isNew ? "Новая заметка" : "Заметка"}</div>
       <input class="modal-title-input" placeholder="Заголовок (опционально)"
         maxlength="120">
       <textarea class="modal-body-input" placeholder="Текст заметки…"></textarea>
       <div class="row">
         <span style="color:var(--hint);font-size:12px">Цвет:</span>
         ${NOTE_COLORS.map(c =>
           `<span class="color-swatch" data-c="${c}" style="background:${c}"></span>`
         ).join("")}
       </div>
       <div class="row">
         <button class="ghost" data-act="pin">${cur.pinned ? "Открепить" : "Закрепить"}</button>
         ${isNew ? "" : '<button class="ghost" data-act="del">🗑 Удалить</button>'}
       </div>
       ${isNew ? "" : '<div class="note-linked" style="color:var(--hint);font-size:12px"></div>'}
       <div class="modal-btns">
         <button class="ghost modal-cancel">Отмена</button>
         <button class="modal-ok">${isNew ? "Создать" : "Сохранить"}</button>
       </div>
     </div>`;
  document.body.appendChild(back);
  // Phase 11.6: подгружаем список связанных задач (только для уже
  // существующей заметки). Лениво, не блокируем рендер модала.
  if (!isNew) {
    api(`/notes/${note.id}/tasks`, {_silent: true}).then(tasks => {
      if (!Array.isArray(tasks) || !tasks.length) return;
      const div = back.querySelector(".note-linked");
      if (!div) return;
      const names = tasks.map(t =>
        (t.important ? "★ " : "") +
        String(t.description).slice(0, 60)
      ).join(" · ");
      div.textContent = `🔗 связано с задачами (${tasks.length}): ${names}`;
    }).catch(() => {});
  }
  const tIn = back.querySelector(".modal-title-input");
  const bIn = back.querySelector(".modal-body-input");
  tIn.value = cur.title || "";
  bIn.value = cur.body || "";
  let chosenColor = cur.color || NOTE_COLORS[0];
  let pinned = !!cur.pinned;
  function refreshSwatches() {
    back.querySelectorAll(".color-swatch").forEach(el => {
      el.classList.toggle("sel", el.dataset.c === chosenColor);
    });
  }
  back.querySelectorAll(".color-swatch").forEach(el => {
    el.onclick = () => { chosenColor = el.dataset.c; refreshSwatches(); };
  });
  refreshSwatches();
  const close = () => back.parentNode && back.parentNode.removeChild(back);
  back.querySelector(".modal-cancel").onclick = close;
  // Pin toggle: меняет локальное состояние + текст кнопки
  const pinBtn = back.querySelector('[data-act="pin"]');
  pinBtn.onclick = () => {
    pinned = !pinned;
    pinBtn.textContent = pinned ? "Открепить" : "Закрепить";
  };
  const delBtn = back.querySelector('[data-act="del"]');
  if (delBtn) {
    delBtn.onclick = async () => {
      close();
      await api(`/notes/${note.id}`, {method:"DELETE"});
      loadNotes();
      uiUndoToast("Заметка удалена.", async () => {
        await api(`/notes/${note.id}/restore`, {method:"POST"});
        loadNotes();
        uiToast("Заметка восстановлена", "ok");
      }, 8000);
    };
  }
  back.querySelector(".modal-ok").onclick = async () => {
    const body = bIn.value.trim();
    if (!body) { uiToast("Тело заметки не может быть пустым"); return; }
    const title = tIn.value.trim();
    if (isNew) {
      await api("/notes", {method:"POST", body: JSON.stringify({
        body, title: title || null, color: chosenColor, pinned,
      })});
    } else {
      const patch = {body, color: chosenColor, pinned};
      if (title) patch.title = title;
      else patch.clear_title = true;
      await api(`/notes/${note.id}`, {method:"PATCH",
        body: JSON.stringify(patch)});
    }
    close();
    loadNotes();
  };
  // ESC закрывает.
  bIn.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); close(); }
  });
  if (tg && tg.BackButton) {
    tg.BackButton.show();
    const off = () => {
      tg.BackButton.hide();
      tg.offEvent("backButtonClicked", off);
      close();
    };
    tg.onEvent("backButtonClicked", off);
  }
  setTimeout(() => (isNew ? bIn : tIn).focus(), 30);
}

// Восстанавливаем сохранённые поля до первого load() — иначе сразу
// пойдёт лишний запрос с дефолтами, а затем повторный с восстановленными.
(function restoreUI() {
  if (_UI.view) $("#viewSel").value = _UI.view;
  if (_UI.sort) $("#sortSel").value = _UI.sort;
  if (_UI.showDone) $("#showDone").checked = true;
  // listId уже инициализирован из _UI; loadLists() сам выставит value.
})();

// Phase 11.8: кнопка ⛶ навешивается, когда DOM готов и шапка отрисована.
_setupFullscreenButton();

(async () => {
  try {
    await loadLists();
    switchSection(_section);   // показывает нужную секцию и грузит её
  }
  catch (e) { /* unauthorized уже показан */ }
})();
</script>
