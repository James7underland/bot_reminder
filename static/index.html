<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Напоминалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#fff);
    --text:var(--tg-theme-text-color,#000);
    --hint:var(--tg-theme-hint-color,#888);
    --link:var(--tg-theme-link-color,#2481cc);
    --btn:var(--tg-theme-button-color,#2481cc);
    --btn-text:var(--tg-theme-button-text-color,#fff);
    --sec:var(--tg-theme-secondary-bg-color,#f1f1f1);
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 -apple-system,system-ui,sans-serif;
       background:var(--bg);color:var(--text)}
  header{padding:14px 16px 6px;font-size:22px;font-weight:700}
  .bar{display:flex;gap:8px;padding:8px 16px}
  .bar input,.bar select{flex:1;min-width:0;padding:9px 10px;border-radius:10px;
       border:1px solid var(--sec);background:var(--sec);color:var(--text)}
  button{cursor:pointer;border:0;border-radius:10px;
       background:var(--btn);color:var(--btn-text);padding:9px 14px;font-size:15px}
  .ghost{background:transparent;color:var(--link);padding:6px}
  ul{list-style:none;margin:0;padding:0 8px 24px}
  li{background:var(--sec);margin:8px;border-radius:12px;padding:10px 12px}
  .row{display:flex;align-items:flex-start;gap:10px}
  .chk{width:22px;height:22px;flex:none;border:2px solid var(--hint);
       border-radius:50%;margin-top:1px}
  .chk.done{background:var(--btn);border-color:var(--btn)}
  .ttl{flex:1;min-width:0;word-break:break-word}
  .done .ttl{text-decoration:line-through;color:var(--hint)}
  .meta{font-size:12px;color:var(--hint);margin-top:3px}
  .overdue .meta,.overdue .ttl{color:#e53935}
  .star{font-size:20px;color:var(--hint);flex:none;background:none;padding:0 2px}
  .star.on{color:#f5b301}
  .panel{margin-top:10px;display:none;flex-direction:column;gap:8px}
  .panel.open{display:flex}
  .panel label{font-size:12px;color:var(--hint)}
  .panel input,.panel select,.panel textarea{width:100%;padding:8px;
       border-radius:8px;border:1px solid var(--hint);
       background:var(--bg);color:var(--text);font:inherit}
  .panel textarea{min-height:54px;resize:vertical}
  .steps .step{display:flex;align-items:center;gap:8px;margin:5px 0}
  .schk{width:18px;height:18px;flex:none;border:2px solid var(--hint);
       border-radius:4px}
  .schk.done{background:var(--btn);border-color:var(--btn)}
  .sdone{text-decoration:line-through;color:var(--hint)}
  .sdel{margin-left:auto;color:var(--hint)}
  .addstep{display:flex;gap:8px}
  .f-cust{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .f-cust .ckrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .f-cust .f-rcn{width:60px;padding:4px}
  .f-cust .f-rcu{width:auto;padding:4px}
  .f-cust .wd{display:flex;flex-wrap:wrap;gap:6px}
  .f-cust .wd label{font-size:12px}
  .pbtns{display:flex;gap:8px;flex-wrap:wrap}
  .muted{color:var(--hint);text-align:center;padding:30px 16px}
</style>
</head>
<body>
<header>Мои задачи</header>
<div class="bar">
  <select id="listSel"></select>
  <button id="newList" class="ghost">+</button>
  <button id="renList" class="ghost">✎</button>
  <button id="delList" class="ghost">🗑</button>
  <button id="tzBtn" class="ghost">⚙</button>
</div>
<div class="bar">
  <input id="newTask" placeholder="Новая задача…" autocomplete="off">
  <button id="addBtn">Добавить</button>
</div>
<div class="bar">
  <input id="search" placeholder="🔎 Поиск…" autocomplete="off">
  <select id="sortSel">
    <option value="">сортировка</option>
    <option value="important">важные</option>
    <option value="due">по сроку</option>
    <option value="alpha">алфавит</option>
    <option value="created">по дате</option>
  </select>
</div>
<div class="bar">
  <select id="viewSel">
    <option value="all">Все задачи</option>
    <option value="myday">🗓 Мой день</option>
    <option value="planned">📅 Планируется</option>
    <option value="important">⭐ Важно</option>
  </select>
  <label style="color:var(--hint);font-size:13px">
    <input type="checkbox" id="showDone"> с выполненными
  </label>
</div>
<ul id="list"></ul>
<div id="empty" class="muted" hidden>Пока нет задач</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const INIT = tg ? tg.initData : "";

async function api(path, opts={}) {
  const r = await fetch("/api" + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Init-Data": INIT,
      ...(opts.headers || {}),
    },
  });
  if (r.status === 401) {
    document.body.innerHTML =
      '<div class="muted">Откройте приложение из Telegram.</div>';
    throw new Error("unauthorized");
  }
  return r.status === 204 ? null : r.json();
}

const $ = (s, el=document) => el.querySelector(s);
let listId = "all";

function fmt(dt){ return dt ? dt.replace("T"," ").slice(0,16) : ""; }
function toInput(s){ return s ? s.slice(0,16).replace(" ","T") : ""; }

let LISTS = [];
async function loadLists(){
  const sel = $("#listSel");
  const lists = await api("/lists");
  LISTS = lists;
  sel.innerHTML =
    '<option value="all">Все задачи</option>' +
    '<option value="0">Без списка</option>' +
    lists.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
  sel.value = listId;
}

function esc(s){ return String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function load(){
  let tasks;
  const sq = $("#search").value.trim();
  const view = $("#viewSel").value;
  if (sq) {
    tasks = await api("/tasks?search=" + encodeURIComponent(sq));
  } else if (view === "myday") {
    tasks = await api("/myday");
  } else if (view === "planned") {
    tasks = await api("/planned");
  } else if (view === "important") {
    tasks = await api("/important");
  } else {
    let q = "?completed=" + ($("#showDone").checked ? "true" : "false");
    if (listId !== "all") q += "&list_id=" + listId;
    const s = $("#sortSel").value;
    if (s) q += "&sort=" + s;
    tasks = await api("/tasks" + q);
  }
  const ul = $("#list"); ul.innerHTML = "";
  $("#empty").hidden = tasks.length > 0;
  for (const t of tasks) ul.appendChild(row(t));
}

function row(t){
  const li = document.createElement("li");
  if (t.overdue) li.classList.add("overdue");
  if (t.completed) li.classList.add("done");
  li.innerHTML = `
    <div class="row">
      <div class="chk ${t.completed?'done':''}" data-act="toggle"></div>
      <div class="ttl">${esc(t.description)}
        <div class="meta"></div></div>
      <button class="star ${t.important?'on':''}" data-act="star">★</button>
    </div>
    <div class="panel">
      <label>Описание<input class="f-desc" value="${esc(t.description)}"></label>
      <label>Срок<input type="datetime-local" class="f-dl"></label>
      <label>Напоминание<input type="datetime-local" class="f-rm"></label>
      <label>Повтор
        <select class="f-rec">
          <option value="">нет</option>
          <option value="daily">ежедневно</option>
          <option value="weekly">еженедельно</option>
          <option value="monthly">ежемесячно</option>
          <option value="yearly">ежегодно</option>
          <option value="custom">свой шаблон…</option>
        </select>
      </label>
      <div class="f-cust" hidden>
        <div class="ckrow">
          <label><input type="radio" name="rcm_${t.id}" class="f-rcm"
                 value="every" checked> Каждые</label>
          <input type="number" min="1" value="1" class="f-rcn">
          <select class="f-rcu">
            <option value="d">день</option>
            <option value="w">неделя</option>
            <option value="m">месяц</option>
            <option value="y">год</option>
          </select>
        </div>
        <div class="ckrow">
          <label><input type="radio" name="rcm_${t.id}" class="f-rcm"
                 value="weekdays"> По дням недели</label>
          <span class="wd">
            <label><input type="checkbox" class="f-wd" value="MO">Пн</label>
            <label><input type="checkbox" class="f-wd" value="TU">Вт</label>
            <label><input type="checkbox" class="f-wd" value="WE">Ср</label>
            <label><input type="checkbox" class="f-wd" value="TH">Чт</label>
            <label><input type="checkbox" class="f-wd" value="FR">Пт</label>
            <label><input type="checkbox" class="f-wd" value="SA">Сб</label>
            <label><input type="checkbox" class="f-wd" value="SU">Вс</label>
          </span>
        </div>
      </div>
      <label>Список
        <select class="f-list">
          <option value="0">Без списка</option>
          ${LISTS.map(l => `<option value="${l.id}">${
            esc(l.name)}</option>`).join("")}
        </select>
      </label>
      <label>Заметка<textarea class="f-notes">${esc(t.notes||"")}</textarea></label>
      <div class="steps" data-loaded="0"></div>
      <div class="addstep">
        <input class="f-step" placeholder="Новая подзадача…">
        <button class="ghost" data-act="addstep">+ шаг</button>
      </div>
      <div class="pbtns">
        <button data-act="save">Сохранить</button>
        <button class="ghost" data-act="myday">${
          t.myday_date ? 'Убрать из «Мой день»' : 'В «Мой день»'}</button>
        <button class="ghost" data-act="clr-dl">Убрать срок</button>
        <button class="ghost" data-act="clr-rm">Убрать напом.</button>
      </div>
    </div>`;
  const meta = [];
  if (t.deadline) meta.push("срок " + fmt(t.deadline) +
      (t.overdue ? " (просрочено)" : ""));
  if (t.reminder_at) meta.push("напомню " + fmt(t.reminder_at));
  if (t.recurrence) meta.push("повтор: " + t.recurrence);
  if (t.myday_date) meta.push("в «Мой день»");
  $(".meta", li).textContent = meta.join(" · ");
  $(".f-dl", li).value = toInput(t.deadline);
  $(".f-rm", li).value = toInput(t.reminder_at);
  // Повтор: пресет или custom (every:N:U / weekdays:...)
  const recSel = $(".f-rec", li);
  const cust = $(".f-cust", li);
  const presets = ["daily","weekly","monthly","yearly"];
  const r = t.recurrence || "";
  let mEvery = r.match(/^every:(\d+):([dwmy])$/);
  let mWeek = r.match(/^weekdays:([A-Z,]+)$/);
  if (!r) { recSel.value = ""; }
  else if (presets.includes(r)) { recSel.value = r; }
  else {
    recSel.value = "custom"; cust.hidden = false;
    if (mEvery) {
      li.querySelector(".f-rcm[value=every]").checked = true;
      $(".f-rcn", li).value = mEvery[1];
      $(".f-rcu", li).value = mEvery[2];
    } else if (mWeek) {
      li.querySelector(".f-rcm[value=weekdays]").checked = true;
      const wd = new Set(mWeek[1].split(","));
      li.querySelectorAll(".f-wd").forEach(c => c.checked = wd.has(c.value));
    }
  }
  recSel.onchange = () => { cust.hidden = recSel.value !== "custom"; };
  $(".f-list", li).value = t.list_id ? String(t.list_id) : "0";

  async function refreshSteps(){
    const box = $(".steps", li);
    const steps = await api(`/tasks/${t.id}/steps`);
    box.dataset.loaded = "1";
    box.innerHTML = steps.map(s => `
      <div class="step" data-sid="${s.id}">
        <span class="schk ${s.completed?'done':''}" data-act="stoggle"
              data-done="${s.completed?1:0}"></span>
        <span class="${s.completed?'sdone':''}">${esc(s.description)}</span>
        <button class="ghost sdel" data-act="sdel">✕</button>
      </div>`).join("");
  }

  $(".ttl", li).onclick = () => {
    const p = $(".panel", li);
    p.classList.toggle("open");
    if (p.classList.contains("open") &&
        $(".steps", li).dataset.loaded === "0") refreshSteps();
  };
  li._refreshSteps = refreshSteps;
  li.addEventListener("click", async (e) => {
    const act = e.target.dataset.act;
    if (!act) return;
    if (act === "toggle") {
      await api(`/tasks/${t.id}/${t.completed?'uncomplete':'complete'}`,
                {method:"POST"});
      load();
    } else if (act === "star") {
      await api(`/tasks/${t.id}`, {method:"PATCH",
        body: JSON.stringify({important: !t.important})});
      load();
    } else if (act === "save") {
      let rec = $(".f-rec",li).value;
      if (rec === "custom") {
        const mode = li.querySelector(".f-rcm:checked")?.value;
        if (mode === "weekdays") {
          const days = [...li.querySelectorAll(".f-wd:checked")]
            .map(c => c.value);
          if (!days.length) { alert("Выберите хотя бы один день"); return; }
          rec = "weekdays:" + days.join(",");
        } else {
          const n = parseInt($(".f-rcn",li).value, 10);
          if (!(n >= 1)) { alert("N должно быть ≥ 1"); return; }
          rec = "every:" + n + ":" + $(".f-rcu",li).value;
        }
      }
      const notes = $(".f-notes",li).value;
      await api(`/tasks/${t.id}`, {method:"PATCH", body: JSON.stringify({
        description: $(".f-desc",li).value,
        deadline: fmt($(".f-dl",li).value) || null,
        reminder_at: fmt($(".f-rm",li).value) || null,
        ...(rec ? {recurrence: rec} : {clear_recurrence: true}),
        ...(notes.trim() ? {notes: notes} : {clear_notes: true}),
      })});
      await api(`/tasks/${t.id}/list`, {method:"POST", body: JSON.stringify(
        {list_id: Number($(".f-list",li).value) || null})});
      load();
    } else if (act === "addstep") {
      const inp = $(".f-step", li);
      if (inp.value.trim()) {
        await api(`/tasks/${t.id}/steps`, {method:"POST",
          body: JSON.stringify({description: inp.value.trim()})});
        inp.value = "";
        li._refreshSteps();
      }
    } else if (act === "stoggle") {
      const st = e.target.closest(".step");
      await api(`/tasks/${t.id}/steps/${st.dataset.sid}/toggle`,
        {method:"POST", body: JSON.stringify(
          {done: e.target.dataset.done !== "1"})});
      li._refreshSteps();
    } else if (act === "sdel") {
      const st = e.target.closest(".step");
      await api(`/tasks/${t.id}/steps/${st.dataset.sid}`,
        {method:"DELETE"});
      li._refreshSteps();
    } else if (act === "myday") {
      await api(`/tasks/${t.id}/myday`, {method:"POST",
        body: JSON.stringify({on: !t.myday_date})});
      load();
    } else if (act === "clr-dl") {
      await api(`/tasks/${t.id}`, {method:"PATCH",
        body: JSON.stringify({clear_deadline:true})}); load();
    } else if (act === "clr-rm") {
      await api(`/tasks/${t.id}`, {method:"PATCH",
        body: JSON.stringify({clear_reminder:true})}); load();
    }
  });
  return li;
}

async function addTask(){
  const inp = $("#newTask");
  const d = inp.value.trim();
  if (!d) return;
  await api("/tasks", {method:"POST", body: JSON.stringify({description:d})});
  inp.value = "";
  load();
}

$("#addBtn").onclick = addTask;
$("#newTask").addEventListener("keydown",
  e => { if (e.key === "Enter") addTask(); });
$("#showDone").onchange = load;
$("#viewSel").onchange = load;
$("#sortSel").onchange = load;
let _searchT;
$("#search").addEventListener("input", () => {
  clearTimeout(_searchT);
  _searchT = setTimeout(load, 350);
});
$("#listSel").onchange = e => { listId = e.target.value; load(); };
$("#newList").onclick = async () => {
  const name = prompt("Название списка");
  if (name && name.trim()) {
    await api("/lists", {method:"POST",
      body: JSON.stringify({name:name.trim()})});
    await loadLists(); load();
  }
};
function curListId(){
  return /^\d+$/.test(listId) ? listId : null;
}
$("#renList").onclick = async () => {
  const id = curListId();
  if (!id) { alert("Сначала выберите список в выпадающем меню"); return; }
  const name = prompt("Новое название списка");
  if (name && name.trim()) {
    await api(`/lists/${id}`, {method:"PATCH",
      body: JSON.stringify({name:name.trim()})});
    await loadLists(); load();
  }
};
$("#delList").onclick = async () => {
  const id = curListId();
  if (!id) { alert("Сначала выберите список в выпадающем меню"); return; }
  if (confirm("Удалить список? Задачи останутся без списка.")) {
    await api(`/lists/${id}`, {method:"DELETE"});
    listId = "all";
    await loadLists(); load();
  }
};
$("#tzBtn").onclick = async () => {
  const cur = (await api("/settings")).timezone;
  const tz = prompt("Часовой пояс (IANA, напр. Europe/Moscow)", cur);
  if (tz && tz.trim() && tz.trim() !== cur) {
    const r = await fetch("/api/settings", {
      method:"PUT",
      headers:{"Content-Type":"application/json","X-Init-Data":INIT},
      body: JSON.stringify({timezone: tz.trim()}),
    });
    if (r.status === 422) alert("Неверный часовой пояс");
    else { alert("Часовой пояс сохранён"); load(); }
  }
};

(async () => {
  try { await loadLists(); await load(); }
  catch (e) { /* unauthorized уже показан */ }
})();
</script>
</body>
</html>
