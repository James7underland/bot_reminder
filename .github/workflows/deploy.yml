name: Deploy

# CD на VPS. Безопасен без секретов: если DEPLOY_* не заданы — джоба
# завершается успешно («skip»), не пачкая историю main.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "Deploy secrets not configured — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Deploy over SSH
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # DEPLOY_SSH_KEY хранится в base64 (одна строка) — так перенос
          # строк приватного ключа не ломается при передаче через секрет.
          printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd ~/bot_reminder
            git pull --ff-only
            ./.venv/bin/pip install -q -r requirements.txt
            sudo -n systemctl restart bot_reminder 2>/dev/null \
              || systemctl restart bot_reminder
            ( sudo -n systemctl restart bot_webapp 2>/dev/null \
              || systemctl restart bot_webapp 2>/dev/null || true )
          '
